services:
  - type: web
    name: learning-companion-studio
    env: node
    plan: free
    buildCommand: "npm run build && cd server && npm install"
    startCommand: "npm start"
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: JWT_SECRET
        generateValue: true
